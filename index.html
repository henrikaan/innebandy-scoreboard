<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Innebandy Scoreboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap');
    .digital-font {
      font-family: 'Chakra Petch', monospace;
    }

    @keyframes match-end-blink {
      0%, 100% { background-color: #020617; }
      50% { background-color: #991b1b; }
    }

    .animate-blink-red {
      animation: match-end-blink 0.5s infinite;
    }

    @keyframes sub-alert-blink {
      0%, 100% { background-color: #991b1b; border-color: #ef4444; }
      50% { background-color: #450a0a; border-color: #b91c1c; }
    }

    .sub-timer-expired {
      animation: sub-alert-blink 0.8s infinite !important;
    }

    /* Forhindre scrolling på mobil og sikre at alt passer på skjermen */
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }
  </style>
</head>
<body id="main-body" class="bg-slate-950 text-white select-none h-screen w-screen flex flex-col justify-between p-1.5 sm:p-3 transition-colors duration-200 overflow-hidden">

  <!-- Minimal Header -->
  <header class="text-center shrink-0">
    <h1 class="text-[10px] sm:text-xs font-semibold tracking-widest text-slate-400 uppercase">Innebandy Match Center</h1>
  </header>

  <!-- Hovedinnhold / Match Grid (Strengt tilpasset skjermhøyden) -->
  <main class="flex-1 w-full max-w-5xl mx-auto flex flex-col justify-between gap-1 py-0.5 min-h-0 overflow-hidden">
    
    <!-- Top Row: Måltavler for begge lag med doblet høyde på +MÅL knappene -->
    <div class="grid grid-cols-2 gap-1.5 flex-[1.4] min-h-0">
      
      <!-- Venstre Lag Box -->
      <div id="card-left" class="bg-gradient-to-b from-orange-950/80 to-orange-900/60 border border-orange-500/50 rounded-xl p-1.5 shadow-lg flex flex-col justify-between items-center relative overflow-hidden h-full">
        <div class="flex justify-between items-center w-full z-10 gap-1">
          <input id="name-left" type="text" value="ORANGE" class="bg-transparent text-base sm:text-xl font-bold text-center text-orange-400 focus:outline-none focus:border-b border-orange-400 uppercase tracking-wider w-full">
          <button onclick="changeScore('left', -1)" class="px-1.5 py-0.5 bg-slate-900/80 hover:bg-slate-800 text-[9px] text-orange-300 font-bold rounded border border-orange-500/30 shrink-0">
            -1
          </button>
        </div>
        
        <!-- Mål-tall -->
        <div id="score-left" class="digital-font text-4xl sm:text-6xl font-bold text-orange-100 my-auto pointer-events-none drop-shadow-md">0</div>
        
        <!-- GIGANTISK/DOBBELT SÅ HØY + MÅL KNAPP (GUL) -->
        <button onclick="changeScore('left', 1)" class="w-full py-4 sm:py-6 bg-yellow-400 hover:bg-yellow-300 active:bg-yellow-200 text-slate-950 font-black text-2xl sm:text-4xl rounded-lg transition shadow-md border border-yellow-300 flex items-center justify-center gap-1 z-10 shrink-0">
          <span>+ MÅL</span>
        </button>
      </div>

      <!-- Høyre Lag Box -->
      <div id="card-right" class="bg-gradient-to-b from-zinc-900 to-zinc-950 border border-zinc-700/80 rounded-xl p-1.5 shadow-lg flex flex-col justify-between items-center relative overflow-hidden h-full">
        <div class="flex justify-between items-center w-full z-10 gap-1">
          <input id="name-right" type="text" value="SVART" class="bg-transparent text-base sm:text-xl font-bold text-center text-zinc-300 focus:outline-none focus:border-b border-zinc-500 uppercase tracking-wider w-full">
          <button onclick="changeScore('right', -1)" class="px-1.5 py-0.5 bg-zinc-900/90 hover:bg-zinc-800 text-[9px] text-zinc-400 font-bold rounded border border-zinc-700 shrink-0">
            -1
          </button>
        </div>
        
        <!-- Mål-tall -->
        <div id="score-right" class="digital-font text-4xl sm:text-6xl font-bold text-zinc-100 my-auto pointer-events-none drop-shadow-md">0</div>
        
        <!-- GIGANTISK/DOBBELT SÅ HØY + MÅL KNAPP (GUL) -->
        <button onclick="changeScore('right', 1)" class="w-full py-4 sm:py-6 bg-yellow-400 hover:bg-yellow-300 active:bg-yellow-200 text-slate-950 font-black text-2xl sm:text-4xl rounded-lg transition shadow-md border border-yellow-300 flex items-center justify-center gap-1 z-10 shrink-0">
          <span>+ MÅL</span>
        </button>
      </div>

    </div>

    <!-- Midtre Del: Kampklokke (Større tall) & Kontroller -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-1.5 flex flex-col items-center justify-center shrink-0">
      
      <div class="flex items-center justify-between w-full px-1">
        <div class="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded-full border border-slate-800">
          <span class="text-[9px] uppercase text-slate-400 font-semibold">Kamp:</span>
          <span id="match-counter-display" class="font-bold text-xs text-yellow-400">1</span>
        </div>

        <!-- STØRRE Kamptidsvisning -->
        <div id="timer-display" class="digital-font text-6xl sm:text-8xl font-bold text-yellow-400 tracking-tight leading-none">
          08:00
        </div>

        <button onclick="swapSides()" title="Bytt banehalvdel" class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2 py-0.5 rounded-full text-[9px] font-bold">
          <span>🔄</span> Side
        </button>
      </div>

      <!-- Kontrollknapper for Kampklokke -->
      <div class="grid grid-cols-3 gap-1 w-full mt-1">
        <button id="start-btn" onclick="toggleTimer()" class="py-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 font-black text-xs sm:text-sm rounded-lg transition shadow">START</button>
        <button onclick="startNewMatch()" class="py-1.5 bg-blue-600 hover:bg-blue-500 active:scale-95 font-bold text-[11px] sm:text-xs text-white rounded-lg transition shadow">Ny kamp</button>
        <button onclick="setCustomTime()" class="py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 font-semibold text-[10px] text-slate-300 rounded-lg transition border border-slate-700">Endre tid</button>
      </div>
    </div>

    <!-- Innbytter-timer -->
    <div id="sub-timer-card" class="bg-slate-900 border border-slate-800 rounded-xl p-1.5 flex items-center justify-between gap-1 shadow shrink-0 relative overflow-hidden">
      <button onclick="setCustomSubTime()" class="absolute top-0.5 right-0.5 px-1 py-0.5 bg-slate-800 text-[8px] text-cyan-300 font-bold rounded border border-cyan-500/30 z-20">
        Endre
      </button>

      <div class="flex items-center gap-1.5">
        <span class="text-base">⏱️</span>
        <div>
          <div class="text-[8px] text-slate-400 font-bold uppercase">Innbytter</div>
          <div id="sub-timer-display" class="digital-font text-xl font-bold text-cyan-400 leading-none">01:00</div>
        </div>
      </div>

      <button onclick="startSubTimer()" class="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white font-black text-xs sm:text-sm rounded-lg transition border border-cyan-400 uppercase tracking-wider shadow">
        START BYTT
      </button>
    </div>

    <!-- Mini Kamplogg Section (Fast plassering nederst, forhindrer overlapping) -->
    <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-1.5 shrink-0 flex flex-col h-20 sm:h-24 overflow-hidden">
      <div class="flex justify-between items-center mb-0.5 px-0.5 shrink-0">
        <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400">📋 Kamplogg</span>
        <button onclick="clearLog()" class="text-[8px] text-slate-500 hover:text-red-400 font-semibold">Nullstill</button>
      </div>

      <div class="overflow-y-auto flex-1 text-[10px] pr-0.5">
        <table class="w-full text-left">
          <tbody id="match-log-body" class="divide-y divide-slate-800/60">
            <tr id="empty-log-msg">
              <td colspan="4" class="py-0.5 text-center text-slate-600 italic">Ingen kamper registrert.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Minimal Footer -->
  <footer class="flex justify-between items-center text-[9px] text-slate-500 shrink-0 border-t border-slate-900 pt-0.5">
    <span id="wake-lock-status">Dvale: Deaktivert</span>
    <button onclick="resetAll()" class="hover:text-red-400 transition font-semibold">Nullstill alt</button>
  </footer>

  <!-- JavaScript logikk -->
  <script>
    let configuredMatchTime = 8 * 60;
    let timeLeft = configuredMatchTime;
    let timerId = null;

    let teamData = {
      left: { score: 0, theme: 'orange' },
      right: { score: 0, theme: 'svart' }
    };

    let matchCount = 1;
    let wakeLock = null;
    let matchHistory = [];

    let configuredSubTime = 60;
    let subTimeLeft = configuredSubTime;
    let subTimerId = null;

    const timerDisplay = document.getElementById('timer-display');
    const startBtn = document.getElementById('start-btn');
    const matchCounterDisplay = document.getElementById('match-counter-display');
    const subTimerDisplay = document.getElementById('sub-timer-display');
    const mainBody = document.getElementById('main-body');
    const matchLogBody = document.getElementById('match-log-body');

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (timerId) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (timeLeft <= 0) return;
      requestWakeLock();
      timerId = setInterval(() => {
        timeLeft--;
        updateDisplay();
        if (timeLeft <= 0) {
          pauseTimer();
          playBuzzer();
          triggerBlinking();
        }
      }, 1000);
      startBtn.textContent = 'PAUSE';
      startBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
      startBtn.classList.add('bg-amber-600', 'hover:bg-amber-500');
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'START';
      startBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');
      startBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
    }

    function setCustomTime() {
      pauseTimer();
      const input = prompt("Tast inn minutter:", Math.floor(configuredMatchTime / 60));
      if (input !== null && !isNaN(input) && input >= 0) {
        configuredMatchTime = parseInt(input) * 60;
        timeLeft = configuredMatchTime;
        updateDisplay();
      }
    }

    function startNewMatch() {
      pauseTimer();

      const leftName = document.getElementById('name-left').value || 'Lag 1';
      const rightName = document.getElementById('name-right').value || 'Lag 2';
      const leftScore = teamData.left.score;
      const rightScore = teamData.right.score;

      const playedSecondsTotal = Math.max(0, configuredMatchTime - timeLeft);
      const durMinutes = Math.floor(playedSecondsTotal / 60);
      const durSeconds = playedSecondsTotal % 60;
      
      let durationStr = "";
      if (durMinutes > 0 && durSeconds > 0) {
        durationStr = `${durMinutes}m ${durSeconds}s`;
      } else if (durMinutes > 0) {
        durationStr = `${durMinutes}m`;
      } else {
        durationStr = `${durSeconds}s`;
      }

      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

      matchHistory.unshift({
        matchNum: matchCount,
        time: timeStr,
        duration: durationStr,
        resultStr: `${leftName} ${leftScore} - ${rightScore} ${rightName}`
      });

      renderLog();

      timeLeft = configuredMatchTime;
      updateDisplay();
      
      teamData.left.score = 0;
      teamData.right.score = 0;
      document.getElementById('score-left').textContent = 0;
      document.getElementById('score-right').textContent = 0;

      matchCount++;
      matchCounterDisplay.textContent = matchCount;
      
      clearInterval(subTimerId);
      subTimerId = null;
      subTimeLeft = configuredSubTime;
      document.getElementById('sub-timer-card').classList.remove('sub-timer-expired');
      updateSubDisplay();
    }

    function renderLog() {
      if (matchHistory.length === 0) {
        matchLogBody.innerHTML = `
          <tr id="empty-log-msg">
            <td colspan="4" class="py-0.5 text-center text-slate-600 italic">Ingen kamper registrert.</td>
          </tr>
        `;
        return;
      }

      matchLogBody.innerHTML = matchHistory.map(item => `
        <tr class="hover:bg-slate-800/40">
          <td class="py-0.5 font-bold text-yellow-400">#${item.matchNum}</td>
          <td class="py-0.5 text-slate-400">${item.time}</td>
          <td class="py-0.5 text-cyan-400 font-semibold">${item.duration}</td>
          <td class="py-0.5 font-semibold text-white">${item.resultStr}</td>
        </tr>
      `).join('');
    }

    function clearLog() {
      matchHistory = [];
      renderLog();
    }

    function changeScore(side, delta) {
      teamData[side].score = Math.max(0, teamData[side].score + delta);
      document.getElementById(`score-${side}`).textContent = teamData[side].score;
    }

    function swapSides() {
      const leftInput = document.getElementById('name-left');
      const rightInput = document.getElementById('name-right');
      const tempName = leftInput.value;
      leftInput.value = rightInput.value;
      rightInput.value = tempName;

      const tempScore = teamData.left.score;
      teamData.left.score = teamData.right.score;
      teamData.right.score = tempScore;

      document.getElementById('score-left').textContent = teamData.left.score;
      document.getElementById('score-right').textContent = teamData.right.score;

      const tempTheme = teamData.left.theme;
      teamData.left.theme = teamData.right.theme;
      teamData.right.theme = tempTheme;

      applyTeamThemes();
    }

    function applyTeamThemes() {
      const cardLeft = document.getElementById('card-left');
      const cardRight = document.getElementById('card-right');
      const nameLeft = document.getElementById('name-left');
      const nameRight = document.getElementById('name-right');

      const orangeCardClasses = ['bg-gradient-to-b', 'from-orange-950/80', 'to-orange-900/60', 'border-orange-500/50'];
      const orangeTextClasses = ['text-orange-400', 'border-orange-400'];

      const svartCardClasses = ['bg-gradient-to-b', 'from-zinc-900', 'to-zinc-950', 'border-zinc-700/80'];
      const svartTextClasses = ['text-zinc-300', 'border-zinc-500'];

      if (teamData.left.theme === 'orange') {
        setCardStyle(cardLeft, nameLeft, orangeCardClasses, orangeTextClasses, svartCardClasses, svartTextClasses);
        setCardStyle(cardRight, nameRight, svartCardClasses, svartTextClasses, orangeCardClasses, orangeTextClasses);
      } else {
        setCardStyle(cardLeft, nameLeft, svartCardClasses, svartTextClasses, orangeCardClasses, orangeTextClasses);
        setCardStyle(cardRight, nameRight, orangeCardClasses, orangeTextClasses, svartCardClasses, svartTextClasses);
      }
    }

    function setCardStyle(cardEl, inputEl, addCard, addText, removeCard, removeText) {
      cardEl.classList.remove(...removeCard);
      cardEl.classList.add(...addCard);
      inputEl.classList.remove(...removeText);
      inputEl.classList.add(...addText);
    }

    function resetAll() {
      if (confirm("Vil du nullstille alt?")) {
        teamData.left.theme = 'orange';
        teamData.right.theme = 'svart';
        document.getElementById('name-left').value = 'ORANGE';
        document.getElementById('name-right').value = 'SVART';
        applyTeamThemes();

        pauseTimer();
        timeLeft = configuredMatchTime;
        updateDisplay();

        teamData.left.score = 0;
        teamData.right.score = 0;
        document.getElementById('score-left').textContent = 0;
        document.getElementById('score-right').textContent = 0;

        matchCount = 1;
        matchCounterDisplay.textContent = matchCount;

        clearLog();

        clearInterval(subTimerId);
        subTimerId = null;
        configuredSubTime = 60;
        subTimeLeft = configuredSubTime;
        document.getElementById('sub-timer-card').classList.remove('sub-timer-expired');
        updateSubDisplay();
      }
    }

    function updateSubDisplay() {
      const minutes = Math.floor(subTimeLeft / 60);
      const seconds = subTimeLeft % 60;
      subTimerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function setCustomSubTime() {
      clearInterval(subTimerId);
      subTimerId = null;
      document.getElementById('sub-timer-card').classList.remove('sub-timer-expired');

      const input = prompt("Tast inn byttetid i sekunder:", configuredSubTime);
      if (input !== null && !isNaN(input) && input > 0) {
        configuredSubTime = parseInt(input);
        subTimeLeft = configuredSubTime;
        updateSubDisplay();
      }
    }

    function startSubTimer() {
      clearInterval(subTimerId);
      subTimeLeft = configuredSubTime;
      
      const subCard = document.getElementById('sub-timer-card');
      subCard.classList.remove('sub-timer-expired');
      
      updateSubDisplay();
      
      subTimerId = setInterval(() => {
        subTimeLeft--;
        updateSubDisplay();
        if (subTimeLeft <= 0) {
          clearInterval(subTimerId);
          subTimerId = null;
          subCard.classList.add('sub-timer-expired');
        }
      }, 1000);
    }

    function playBuzzer() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
      } catch (e) {
        console.log("Audio API blocked", e);
      }
    }

    function triggerBlinking() {
      mainBody.classList.add('animate-blink-red');
      setTimeout(() => {
        mainBody.classList.remove('animate-blink-red');
      }, 15000);
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('wake-lock-status').textContent = 'Dvale: Blokkert';
        } catch (err) {
          console.log(err);
        }
      }
    }

    updateDisplay();
    updateSubDisplay();
  </script>
</body>
</html>
